<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="utf-8">
  <title>文字捕獲工具</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>

<!-- ── Header ─────────────────────────────────────────────────────────────── -->
<header class="hdr">
  <img src="../icons/CaptureText_icon.png" class="hdr-icon" alt="">
  <span class="hdr-title">文字捕獲工具</span>
  <span class="hdr-ver">v1.0.7</span>
  <button id="btn-pin-toggle" class="btn-pin" title="置頂：關閉（點擊切換）">📌</button>
  <button id="btn-close-panel" class="hdr-close" title="關閉">✕</button>
</header>

<!-- ── Tab buttons ────────────────────────────────────────────────────────── -->
<nav class="tabs">
  <button class="tab-btn active" data-tab="scan">🔍 掃描</button>
  <button class="tab-btn"        data-tab="batch">🔗 批量</button>
  <button class="tab-btn"        data-tab="settings">⚙ 設定</button>
  <button class="tab-btn"        data-tab="log">📋 日誌</button>
</nav>

<!-- ══════════════════════════════════════════════════════════════════════════
     TAB: 掃描
     ══════════════════════════════════════════════════════════════════════════ -->
<section id="tab-scan" class="tab-panel active">

  <div class="page-info-row">
    <span class="page-info-lbl">當前讀取的頁面標題</span>
    <span id="page-title" class="page-title" title="">正在讀取頁面…</span>
    <button id="btn-refresh-tab" class="btn btn-xs btn-ghost" title="重啟工具（重新載入擴充元件面板）">🔄</button>
  </div>

  <div class="row gap-6">
    <button id="btn-scan"      class="btn btn-primary flex-1">🔍 掃描</button>
    <button id="btn-stop-scan" class="btn btn-danger"  disabled>⏹ 停止</button>
  </div>

  <div id="scan-progress-wrap" class="progress-wrap hidden">
    <div id="scan-progress-bar" class="progress-bar" style="width:0%"></div>
  </div>
  <div id="scan-status" class="status-line">尚未掃描</div>

  <div class="row gap-4 mt-4">
    <button class="btn btn-xs btn-blue"  id="qs-role0">僅選 role0</button>
    <button class="btn btn-xs btn-green" id="qs-role1">僅選 role1</button>
    <button class="btn btn-xs btn-ghost" id="qs-all">全選</button>
    <button class="btn btn-xs btn-ghost" id="qs-none">清除</button>
  </div>

  <div id="msg-list" class="msg-list hidden"></div>
  <div id="msg-empty" class="empty-hint">請先點擊「掃描」</div>

  <div id="capture-bar" class="capture-bar hidden">
    <span id="sel-count">已選 0 筆</span>
    <button id="btn-capture" class="btn btn-primary btn-sm">⚡ 確認選取</button>
  </div>

  <div id="export-row" class="export-row hidden">
    <span class="export-label">匯出：</span>
    <button class="btn btn-xs btn-export" data-fmt="txt">TXT</button>
    <button class="btn btn-xs btn-export" data-fmt="html">HTML</button>
    <button class="btn btn-xs btn-export" data-fmt="xls">XLS</button>
    <button class="btn btn-xs btn-export" data-fmt="clipboard">📋</button>
    <button id="btn-sidebar-bottom" class="btn btn-xs btn-ghost">📖 閱讀模式瀏覽</button>
  </div>

</section>

<!-- ══════════════════════════════════════════════════════════════════════════
     TAB: 批量
     ══════════════════════════════════════════════════════════════════════════ -->
<section id="tab-batch" class="tab-panel hidden">

  <label class="lbl">URL 清單（每行一筆）</label>
  <textarea id="batch-urls" class="textarea" rows="7" placeholder="https://chatgpt.com/share/abc123&#10;https://chatgpt.com/share/def456&#10;..."></textarea>

  <div class="row gap-6 mt-6">
    <button id="btn-batch-start"  class="btn btn-primary flex-1">▶ 開始批量</button>
    <button id="btn-batch-cancel" class="btn btn-danger hidden">✕ 取消</button>
  </div>

  <div id="batch-progress-wrap" class="progress-wrap hidden">
    <div id="batch-progress-bar" class="progress-bar" style="width:0%"></div>
  </div>
  <div id="batch-status" class="status-line mt-4">尚未執行</div>

  <div class="hint-box mt-6">
    <strong>批量流程：</strong><br>
    ① 輸入 URL 清單 → ② 點「開始批量」→ 每頁自動掃描 + 匯出檔案 → 自動跳至下一頁
  </div>

</section>

<!-- ══════════════════════════════════════════════════════════════════════════
     TAB: 設定
     ══════════════════════════════════════════════════════════════════════════ -->
<section id="tab-settings" class="tab-panel hidden">

  <!-- ── 掃描設定 ── -->
  <div class="settings-group-title">掃描設定</div>

  <div class="field">
    <label class="lbl">CSS 選擇器</label>
    <input id="cfg-selector" class="input" type="text" value="[data-message-author-role]">
  </div>
  <div class="field">
    <label class="lbl">角色屬性名稱</label>
    <input id="cfg-roleAttr" class="input" type="text" value="data-message-author-role">
  </div>
  <div class="field">
    <label class="lbl">目標角色（逗號分隔）</label>
    <input id="cfg-targetRoles" class="input" type="text" value="assistant,user">
  </div>
  <div class="field">
    <label class="lbl">捲動延遲 200~3000（ms）</label>
    <input id="cfg-scrollDelay" class="input" type="number" min="200" max="3000" step="50" value="350">
  </div>
  <div class="field">
    <label class="lbl">預設選取<small>（選項跟隨目標角色自動產生）</small></label>
    <select id="cfg-defaultSelection" class="select">
      <!-- options rebuilt dynamically -->
    </select>
  </div>

  <!-- ── 匯出設定 ── -->
  <div class="settings-group-title">匯出設定</div>

  <div class="field row gap-8">
    <label class="lbl">自動匯出（掃描完成後立即下載）</label>
    <input id="cfg-autoExport" type="checkbox" checked>
  </div>

  <div class="field">
    <label class="lbl">自動匯出格式</label>
    <select id="cfg-exportFormat" class="select">
      <option value="xls">Excel (XLS)</option>
      <option value="txt">純文字 (TXT)</option>
      <option value="html">網頁 (HTML)</option>
      <option value="clipboard">剪貼簿</option>
    </select>
  </div>

  <div class="field">
    <label class="lbl">自訂檔名模板
      <small>（$D=yyyymmdd / $T=hhmm / $Ts=hhmmss / $M=總筆數(XLS) / $K=處理後筆數(XLS)；留空=頁面標題）</small>
    </label>
    <input id="cfg-exportFilename" class="input" type="text" placeholder="$D$T-$M-$K">
  </div>

  <div class="field">
    <label class="lbl">下載子資料夾<small>（相對於瀏覽器預設下載路徑；留空=預設位置）</small></label>
    <input id="cfg-downloadSubfolder" class="input" type="text" placeholder="例：GPT_captures">
  </div>

  <!-- ── XLS 資料處理 ── -->
  <div class="settings-group-title">XLS 資料處理</div>

  <div class="field row gap-8">
    <label class="lbl">匯出角色欄位<small>（關閉後匯出內容不含角色ID）</small></label>
    <input id="cfg-exportRole" type="checkbox">
  </div>

  <div class="field">
    <label class="lbl">XLS 欄位名稱<small>（逗號分隔，依序對應抓取欄位；預設：標題,內容）</small></label>
    <input id="cfg-xlsColNames" class="input" type="text" placeholder="標題,內容">
  </div>

  <div class="field">
    <label class="lbl">XLS 首欄抓取目標<small>（前綴+後綴包圍的內容獨立為第一欄；全部留空則不分割）</small></label>
    <div class="row gap-4">
      <input id="cfg-xlsPrefix" class="input" type="text" placeholder="前綴，如 |標題：" style="flex:1">
      <span style="color:var(--muted);font-size:.8em;flex-shrink:0">…</span>
      <input id="cfg-xlsSuffix" class="input" type="text" placeholder="後綴，如 |" style="flex:1">
    </div>
    <div class="field row gap-8 mt-4">
      <label class="lbl">後綴後方包含換行</label>
      <input id="cfg-xlsSuffixNewline" type="checkbox" checked>
    </div>
    <div class="field row gap-8 mt-2">
      <label class="lbl">匹配前後綴時包括空格<small>（如「|標題：」與「| 標題：」視為相同）</small></label>
      <input id="cfg-xlsPrefixTrimSpaces" type="checkbox" checked>
    </div>
  </div>

  <div class="field row gap-8">
    <label class="lbl">將 XLS 字數不足的儲存格刪除</label>
    <input id="cfg-xlsMinCellCharsEnabled" type="checkbox" checked>
  </div>
  <div class="field">
    <label class="lbl">最低字數門檻（字元數）</label>
    <input id="cfg-xlsMinCellChars" class="input" type="number" min="1" max="99999" value="300">
  </div>

  <div class="field">
    <label class="lbl">XLS 清除目標（逗號分隔）<br><small>從儲存格內容（含標題欄）中移除完美匹配的指定字串</small></label>
    <input id="cfg-xlsCleanTargets" class="input" type="text" value="標題：">
  </div>

  <div class="field">
    <label class="lbl">XLS 排除關鍵字目標行（換行分隔）<br><small>包含此關鍵字的行將整行刪除</small></label>
    <textarea id="cfg-xlsExcludeLines" class="textarea" rows="5"></textarea>
  </div>

  <div class="field row gap-8">
    <label class="lbl">保留 XLS 異常標記之內容<small>（在最後一欄標示刪除或清除原因）</small></label>
    <input id="cfg-xlsKeepAnomalyMarker" type="checkbox">
  </div>

  <div class="row mt-8 gap-6">
    <button id="btn-save-cfg"  class="btn btn-primary flex-1">💾 儲存設定</button>
    <button id="btn-reset-cfg" class="btn btn-ghost">重置</button>
  </div>

</section>

<!-- ══════════════════════════════════════════════════════════════════════════
     TAB: 日誌
     ══════════════════════════════════════════════════════════════════════════ -->
<section id="tab-log" class="tab-panel hidden">

  <!-- Log settings -->
  <div class="settings-group-title">日誌設定</div>
  <div class="field row gap-8">
    <label class="lbl">日誌自動匯出<small>（每次操作後自動下載日誌）</small></label>
    <input id="cfg-logAutoExport" type="checkbox" checked>
  </div>
  <div class="field">
    <label class="lbl">日誌下載子資料夾<small>（留空=使用下載設定路徑）</small></label>
    <input id="cfg-logDownloadSubfolder" class="input" type="text" placeholder="例：logs">
  </div>
  <div class="field">
    <label class="lbl">日誌檔名模板<small>（前綴固定加「log-」；留空預設 log-$D$T；可用：$D / $T / $Ts）</small></label>
    <input id="cfg-logFilename" class="input" type="text" placeholder="留空預設 log-$D$T">
  </div>
  <div class="row gap-6" style="margin:8px 0">
    <button id="btn-save-log-cfg" class="btn btn-primary btn-sm flex-1">💾 儲存日誌設定</button>
  </div>

  <!-- Log list -->
  <div class="settings-group-title" style="margin-top:10px">日誌記錄</div>
  <div class="row gap-6" style="margin-bottom:8px">
    <button id="btn-clear-log"  class="btn btn-ghost btn-sm flex-1">🗑 清除日誌</button>
    <button id="btn-export-log" class="btn btn-ghost btn-sm flex-1">💾 匯出日誌</button>
  </div>

  <div id="log-list" class="log-list">
    <div class="empty-hint">尚無日誌記錄</div>
  </div>

</section>

<!-- ── Footer status bar ──────────────────────────────────────────────────── -->
<footer id="footer-bar" class="footer-bar">就緒</footer>

<script src="popup.js"></script>
</body>
</html>
